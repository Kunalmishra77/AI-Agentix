# AI Agentix — recommended nginx server block (AGX-005/006/009).
# NOT applied automatically. Merge into the live site config on the VPS after
# comparing with it (sudo nginx -T), then: sudo nginx -t && sudo systemctl reload nginx
#
# Assumes: built site in /var/www/ai-agentix/frontend/dist, Express API on 127.0.0.1:5000.
# If a Caddy (or other) proxy terminates TLS in front of nginx, keep its TLS/redirect
# config and put these headers in ONE place only (not both).

# --- in the http {} block (nginx.conf) ---
# server_tokens off;

server {
    listen 80;   # or the port the TLS proxy forwards to; keep your existing listen/ssl lines
    server_name ai-agentix.com;

    root /var/www/ai-agentix/frontend/dist;
    index index.html;
    absolute_redirect off;   # behind Traefik/Caddy: never send redirects with nginx's internal port

    server_tokens off;

    # --- security headers (copy nginx-agx-security-headers.conf to /etc/nginx/snippets/) ---
    include snippets/nginx-agx-security-headers.conf;

    # --- compression: serve the .br/.gz files written at build time ---
    gzip_static on;
    # brotli_static on;   # only if the ngx_brotli module is installed (nginx -V)
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # --- caching ---
    location /assets/ {                       # hashed file names → cache forever
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/nginx-agx-security-headers.conf;
        try_files $uri =404;
    }
    location ~* ^/(images|home)/ {            # images + hero video
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/nginx-agx-security-headers.conf;
        try_files $uri =404;
    }
    location /lead-widget/ {                  # versioned with ?v=
        expires 7d;
        include snippets/nginx-agx-security-headers.conf;
        try_files $uri =404;
    }

    # --- API (Express) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    # --- pages: every route has its own prerendered index.html; anything else is a real 404 ---
    location / {
        add_header Cache-Control "no-cache" always;   # HTML always revalidated so deploys show immediately
        include snippets/nginx-agx-security-headers.conf;
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; include snippets/nginx-agx-security-headers.conf; }

    # never serve dotfiles (.env, .git …)
    location ~ /\. { deny all; return 404; }
}


# AI Agentix security headers — include in the server block AND in every location
# that has its own add_header (nginx does not inherit add_header into such locations).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # only once HTTPS works on every subdomain; no preload
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
# Report-Only first: watch the browser console on every page, then switch the header
# name to Content-Security-Policy. Google Tag Manager (two containers) is in use: tags the
# marketing team adds in GTM may load from more domains; add those here before enforcing.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.googletagmanager.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.co.in https://*.g.doubleclick.net; media-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com https://*.g.doubleclick.net https://pagead2.googlesyndication.com https://www.googleadservices.com; frame-src https://www.googletagmanager.com https://td.doubleclick.net https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

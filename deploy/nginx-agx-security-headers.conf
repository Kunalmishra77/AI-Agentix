# AI Agentix security headers — include in the server block AND in every location
# that has its own add_header (nginx does not inherit add_header into such locations).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # only once HTTPS works on every subdomain; no preload
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
# Report-Only first: watch the browser console on every page, then switch the header
# name to Content-Security-Policy. Add your analytics domains here if you add analytics.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

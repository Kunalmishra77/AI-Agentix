<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#12141A" />
    <link rel="preload" as="image" href="/agentix-logo-dark.png" />
    <!--
      Route-specific title/description/canonical/OG tags are written into each route's
      HTML at build time (scripts/prerender-meta.mjs) and kept in sync by react-helmet-async
      at runtime. data-rh lets Helmet replace these instead of duplicating them.
    -->
    <title>AI Agentix — AI Automation Experts for Indian Businesses</title>
    <meta data-rh="true" name="description" content="AI Agentix builds AI agents and end-to-end automation for sales, marketing, HR, operations, finance and customer support — for growing businesses in India and worldwide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand fonts: Poppins (display + body) | JetBrains Mono (technical labels) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Preloader: shown only while the app bundle downloads; removed on first render (AGX-026). -->
    <style>
      #agx-preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(155deg, #FFE9DC 0%, #FFF6F1 55%, #FFFFFF 100%);
        font-family: 'Poppins', system-ui, sans-serif;
        transition: opacity .25s ease;
      }
      #agx-preloader.agx-hide { opacity: 0; pointer-events: none; }
      .agx-logo { height: 58px; width: auto; }
      .agx-tag { margin-top: 18px; font-size: 11px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; color: #8A4B2E; }
    </style>

    <!-- Floating lead form (lead-widget skill kit) — bottom-right; posts to our own /api/leads -->
    <link rel="stylesheet" href="/lead-widget/lead-widget.css?v=2" />
    <script>
      window.LeadWidgetConfig = {
        endpoint: '/api/leads',
        thankYouUrl: '/thank-you?type=popup',
        openThankYouInNewTab: false,
        brandColor: '#CC4A12',
        position: 'right',
        bottomOffset: 20,
        sideOffset: 20,
        zIndex: 60,
        eyebrow: 'Free consultation',
        title: 'Talk to an AI expert',
        text: 'Share your details and our team will call or WhatsApp you within 4 business hours.',
        submitText: 'Request a Call Back',
        iconLabel: 'Book a free consultation',
        namePlaceholder: 'Full Name',
        phonePlaceholder: 'Mobile number',
        emailPlaceholder: 'Email (optional)',
        messagePlaceholder: 'What would you like to automate? (optional)',
        phonePattern: '^(?:[6-9][0-9]{9}|[0-9]{11,15})$',
        phoneMaxLength: 15,
        phoneError: 'Please enter a 10-digit mobile number, or your full number with country code.',
        consentHtml: 'I agree that AI Agentix may contact me about this enquiry by call, WhatsApp, SMS or email — once or more than once, even if my number is on DND. I can withdraw anytime. <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>',
        consentError: 'Please tick the box to agree, so we can contact you about your enquiry.',
        autoShowPages: ['/'],
        gtagEvent: 'generate_lead',
        dataLayerEvent: 'generate_lead'
      };
    </script>
    <script src="/lead-widget/lead-widget.js?v=2" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="agx-preloader" role="status" aria-label="Loading AI Agentix">
      <img class="agx-logo" src="/agentix-logo-dark.png" alt="AGENTiX" width="139" height="58" />
      <div class="agx-tag">Intelligent Automation</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Agentix — Enterprise Agentic AI Systems, n8n Automation & LLM Integration" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- Platform fonts: Manrope + Inter + JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- AI Agentex brand fonts: Poppins (display+body) | Bebas Neue (big numbers) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <title>AI Agentex — India's #1 End-to-End AI Automation Partner</title>

    <!-- Premium preloader — inlined so it paints instantly, before the bundle/Tailwind load.
         Minimal by design: one mark + one real progress bar (transform-driven). -->
    <style>
      #agx-preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #ffffff;
        font-family: 'Poppins', system-ui, sans-serif;
        opacity: 1; transition: opacity .5s ease, transform .5s ease, filter .5s ease;
      }
      #agx-preloader.agx-hide { opacity: 0; transform: scale(1.03); filter: blur(4px); pointer-events: none; }

      .agx-mark { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
      .agx-mark::before {
        content: ""; position: absolute; width: 86px; height: 86px; border-radius: 50%;
        background: radial-gradient(circle, rgba(242,101,34,.20) 0%, rgba(242,101,34,0) 68%);
        animation: agx-breathe 2.6s ease-in-out infinite;
      }
      .agx-brain { width: 52px; height: 52px; filter: drop-shadow(0 6px 16px rgba(242,101,34,.26)); }
      .agx-brain path {
        stroke: #F26522; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1; animation: agx-draw 1.1s cubic-bezier(.4,0,.2,1) forwards;
      }
      .agx-brain path:nth-child(2) { animation-delay: .12s; }

      .agx-word { margin-top: 20px; font-weight: 800; font-size: 22px; letter-spacing: .14em; color: #12141A;
        opacity: 0; animation: agx-rise .55s ease .35s forwards; }
      .agx-word i { color: #F26522; font-style: normal; }
      .agx-tag { margin-top: 7px; font-size: 11px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase;
        color: #9AA3B2; opacity: 0; animation: agx-rise .55s ease .5s forwards; }

      .agx-bar { position: relative; margin-top: 26px; width: 176px; height: 3px; border-radius: 999px;
        background: #ECECEE; overflow: hidden; opacity: 0; animation: agx-rise .5s ease .55s forwards; }
      .agx-bar-fill { position: absolute; inset: 0; border-radius: 999px;
        background: linear-gradient(90deg, #F26522, #FF9152);
        transform-origin: left; transform: scaleX(0);
        animation: agx-fill 1.5s cubic-bezier(.25,.8,.25,1) .55s forwards; }

      @keyframes agx-draw    { to { stroke-dashoffset: 0; } }
      @keyframes agx-breathe { 0%,100% { transform: scale(.9); opacity: .6; } 50% { transform: scale(1.06); opacity: 1; } }
      @keyframes agx-rise    { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes agx-fill    { from { transform: scaleX(0); } to { transform: scaleX(.82); } }

      @media (prefers-reduced-motion: reduce) {
        #agx-preloader *, #agx-preloader *::before { animation: none !important; }
        .agx-brain path { stroke-dashoffset: 0; }
        .agx-word, .agx-tag, .agx-bar { opacity: 1; }
        .agx-bar-fill { transform: scaleX(.82); }
      }
    </style>
  </head>
  <body>
    <!-- Premium AI preloader (removed by main.jsx once fonts/app are ready) -->
    <div id="agx-preloader" role="status" aria-label="Loading AI Agentix">
      <div class="agx-mark">
        <svg class="agx-brain" viewBox="0 0 24 24" aria-hidden="true">
          <path pathLength="1" d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
          <path pathLength="1" d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
        </svg>
      </div>
      <div class="agx-word">AGENT<i>i</i>X</div>
      <div class="agx-tag">Intelligent Automation</div>
      <div class="agx-bar" aria-hidden="true"><span class="agx-bar-fill"></span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
